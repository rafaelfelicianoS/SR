name: Build and Publish PDF

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: paper/main.tex
          work_in_root_file_dir: true

      - name: Prepare pages folder
        run: |
          mkdir -p public
          cp paper/main.pdf public/main.pdf
          echo '<meta http-equiv="refresh" content="0; url=main.pdf">' > public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Add PDF link to summary
        run: echo "📄 [Ver PDF](${{ steps.deployment.outputs.page_url }}main.pdf)" >> $GITHUB_STEP_SUMMARY